<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist Hub | Chatsong Community</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      padding: 30px 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      border-radius: 16px;
      text-align: center;
      margin: 20px;
    }
    .profile-pic {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 12px;
      border: 2px solid #eaeaea;
    }
    h1 {
      font-size: 22px;
      margin: 5px 0 5px;
      color: #1a1a1a;
    }
    .bio {
      font-size: 13px;
      color: #666;
      margin-bottom: 25px;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: block;
      background: #f1f3f5;
      color: #212529;
      padding: 14px 16px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: #e9ecef;
      transform: translateY(-2px);
    }
    .btn-primary {
      background: #0066cc;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #0052a3;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Profile Info -->
    <img src="artist-photo.jpg" alt="Artist Name" class="profile-pic">
    <h1>Artist Name</h1>
    <p class="bio">Independent Musician | Featured on Chatsong</p>

    <!-- Links Section -->
    <div class="links">
      <!-- Topic Link -->
      <a href="https://chatsong.nl/d/1832-second-single-mystery-land-out-today" class="btn btn-primary" target="_blank">
        💬 Topic Link: "Mystery Land" Release
      </a>

      <!-- Profile Link -->
      <a href="https://chatsong.nl/u/artistname" class="btn" target="_blank">
        👤 Profile Link on Chatsong
      </a>

      <!-- Music / Bandcamp Link -->
      <a href="https://artist.bandcamp.com" class="btn" target="_blank">
        🎵 Listen & Support on Bandcamp
      </a>

      <!-- Official Website Link -->
      <a href="https://artistwebsite.com" class="btn" target="_blank">
        🌐 Official Website & Info
      </a>
    </div>
  </div>
</body>
</html>
