
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist Hub | Powered by Chatsong</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --btn-bg: rgba(255, 255, 255, 0.08);
      --btn-hover: rgba(255, 255, 255, 0.15);
      --accent: #38bdf8;
      --accent-gradient: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      padding: 40px 24px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      margin: 20px;
    }

    .profile-pic-wrapper {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 0 auto 16px;
    }

    .profile-pic {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(56, 189, 248, 0.5);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 6px;
      letter-spacing: -0.5px;
    }

    .bio {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 32px;
      font-weight: 400;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--btn-bg);
      color: var(--text-main);
      padding: 16px 20px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn:hover {
      background: var(--btn-hover);
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    /* De primaire knop (voor de nieuwe Release / Topic Link) met hippe gradient */
    .btn-primary {
      background: var(--accent-gradient);
      border: none;
      box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #0284c7 0%, #4f46e5 100%);
      box-shadow: 0 6px 20px rgba(14, 165, 233, 0.5);
    }

    .footer-brand {
      margin-top: 30px;
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .footer-brand a {
      color: var(--accent);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Profielfoto van de artiest -->
    <div class="profile-pic-wrapper">
      <img src="artist-photo.jpg" alt="Artist Name" class="profile-pic">
    </div>
    
    <h1>Artist Name</h1>
    <p class="bio">Independent Musician &bull; Member of Chatsong</p>

    <!-- Knoppen & Links (Artiesten kunnen dit zelf aanpassen) -->
    <div class="links">
      
      <!-- 1. TOPIC LINK (Vervang de URL hieronder met het Chatsong releasetopic) -->
      <a href="https://chatsong.nl/d/1832-second-single-mystery-land-out-today" class="btn btn-primary" target="_blank">
        💬 Chatsong Topic: Latest Release
      </a>

      <!-- 2. PROFILE LINK (Vervang de URL met het Chatsong profiel van de artiest) -->
      <a href="https://chatsong.nl/u/artistname" class="btn" target="_blank">
        👤 Chatsong Community Profile
      </a>

      <!-- 3. MUSIC STREAM (Bandcamp / SoundCloud / etc.) -->
      <a href="https://artist.bandcamp.com" class="btn" target="_blank">
        🎵 Listen on Bandcamp
      </a>

      <!-- 4. OFFICIAL WEBSITE -->
      <a href="https://artistwebsite.com" class="btn" target="_blank">
        🌐 Official Website & Info
      </a>

    </div>

    <div class="footer-brand">
      Powered by <a href="https://chatsong.nl" target="_blank">Chatsong</a>
    </div>
  </div>
</body>
</html>
