<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist Hub | Powered by Chatsong</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --btn-bg: rgba(255, 255, 255, 0.08);
      --btn-hover: rgba(255, 255, 255, 0.15);
      --accent: #38bdf8;
      --accent-gradient: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
      --submit-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      padding: 30px 20px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .profile-pic {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(56, 189, 248, 0.5);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
      margin-bottom: 12px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 5px;
    }

    .bio {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--btn-bg);
      color: var(--text-main);
      padding: 14px 18px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: var(--btn-hover);
      transform: translateY(-2px);
    }

    .btn-primary {
      background: var(--accent-gradient);
      border: none;
      box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
    }

    .btn-submit {
      background: var(--submit-gradient);
      color: white;
      border: none;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s ease;
    }

    .btn-submit:hover {
      opacity: 0.9;
      transform: scale(0.99);
    }

    /* Editor Box */
    .editor-box {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 18px;
      border-radius: 16px;
      margin-bottom: 24px;
      text-align: left;
    }

    .editor-box h3 {
      font-size: 15px;
      margin: 0 0 12px;
      color: var(--accent);
    }

    .editor-box label {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 8px;
      margin-bottom: 4px;
    }

    .editor-box input {
      width: 100%;
      padding: 9px 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #fff;
      font-size: 12px;
      box-sizing: border-box;
    }

    .editor-box input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .result-box {
      display: none;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      border-radius: 10px;
      padding: 12px;
      margin-top: 15px;
      text-align: center;
    }

    .result-box p {
      font-size: 12px;
      margin: 0 0 8px;
      color: #6ee7b7;
    }

    .toggle-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .footer-brand {
      margin-top: 25px;
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .footer-brand a {
      color: var(--accent);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    
    <button class="toggle-btn" onclick="toggleEditor()">⚙️ Create / Update Your Links</button>

    <!-- INVOER / SUBMIT FORMULIER -->
    <div id="editorPanel" class="editor-box">
      <h3>🚀 Generate Your Bio Link</h3>
      
      <label>Artist Name:</label>
      <input type="text" id="inputName" placeholder="e.g. John Doe">

      <label>Chatsong Username:</label>
      <input type="text" id="inputUsername" placeholder="e.g. johndoe">

      <label>Chatsong Latest Topic / Release URL:</label>
      <input type="text" id="inputTopic" placeholder="https://chatsong.nl/d/1832-...">

      <label>Spotify Track / Album Link:</label>
      <input type="text" id="inputSpotify" placeholder="https://open.spotify.com/track/...">

      <label>Bandcamp / SoundCloud Link:</label>
      <input type="text" id="inputBandcamp" placeholder="https://artist.bandcamp.com">

      <label>YouTube Video / Channel Link:</label>
      <input type="text" id="inputYoutube" placeholder="https://youtube.com/watch?v=...">

      <label>Official Website:</label>
      <input type="text" id="inputWeb" placeholder="https://yourwebsite.com">

      <!-- SUBMIT KNOP -->
      <button class="btn-submit" onclick="generateLink()">✨ Generate & Submit Instagram Link</button>

      <!-- RESULTAAT / KOPIEER KNOP -->
      <div id="resultBox" class="result-box">
        <p>✅ Your custom Linktree URL is ready!</p>
        <button class="btn" style="width:100%; background:#10b981; color:#fff;" onclick="copyInstagramLink()">📋 Copy Link for Instagram Bio</button>
      </div>
    </div>

    <!-- PREVIEW & LIVE WEERGAVE VAN DE KNOPPEN -->
    <img src="https://via.placeholder.com/150" alt="Artist" class="profile-pic" id="profileImg">
    <h1 id="displayName">Artist Name</h1>
    <p class="bio">Independent Musician &bull; Member of Chatsong</p>

    <div class="links">
      <a href="#" id="linkTopic" class="btn btn-primary" target="_blank" style="display:none;">
        💬 Chatsong Topic: Latest Release
      </a>

      <a href="#" id="linkProfile" class="btn" target="_blank" style="display:none;">
        👤 Chatsong Community Profile
      </a>

      <a href="#" id="linkSpotify" class="btn" target="_blank" style="display:none;">
        🎧 Listen on Spotify
      </a>

      <a href="#" id="linkBandcamp" class="btn" target="_blank" style="display:none;">
        🎵 Listen on Bandcamp / SoundCloud
      </a>

      <a href="#" id="linkYoutube" class="btn" target="_blank" style="display:none;">
        ▶️ Watch on YouTube
      </a>

      <a href="#" id="linkWeb" class="btn" target="_blank" style="display:none;">
        🌐 Official Website
      </a>
    </div>

    <div class="footer-brand">
      Powered by <a href="https://chatsong.nl" target="_blank">Chatsong</a>
    </div>
  </div>

  <script>
    let generatedUrl = "";

    // Parse URL parameters when someone opens the link from Instagram
    window.onload = function() {
      const params = new URLSearchParams(window.location.search);
      
      if (params.has('name')) {
        // Hide editor if loaded via a unique link
        document.getElementById('editorPanel').style.display = 'none';
        
        const name = params.get('name');
        const user = params.get('user');
        const topic = params.get('topic');
        const spotify = params.get('spotify');
        const bandcamp = params.get('bandcamp');
        const yt = params.get('yt');
        const web = params.get('web');

        document.getElementById('displayName').innerText = name;

        if (topic) setupBtn('linkTopic', topic);
        if (user) setupBtn('linkProfile', 'https://chatsong.nl/u/' + user);
        if (spotify) setupBtn('linkSpotify', spotify);
        if (bandcamp) setupBtn('linkBandcamp', bandcamp);
        if (yt) setupBtn('linkYoutube', yt);
        if (web) setupBtn('linkWeb', web);
      } else {
        // Show default preview links
        setupBtn('linkTopic', 'https://chatsong.nl');
        setupBtn('linkProfile', 'https://chatsong.nl');
      }
    };

    function setupBtn(id, url) {
      const btn = document.getElementById(id);
      btn.href = url;
      btn.style.display = 'flex';
    }

    function generateLink() {
      const name = encodeURIComponent(document.getElementById('inputName').value || 'Artist');
      const user = encodeURIComponent(document.getElementById('inputUsername').value || '');
      const topic = encodeURIComponent(document.getElementById('inputTopic').value || '');
      const spotify = encodeURIComponent(document.getElementById('inputSpotify').value || '');
      const bandcamp = encodeURIComponent(document.getElementById('inputBandcamp').value || '');
      const yt = encodeURIComponent(document.getElementById('inputYoutube').value || '');
      const web = encodeURIComponent(document.getElementById('inputWeb').value || '');

      const baseUrl = window.location.origin + window.location.pathname;
      generatedUrl = `${baseUrl}?name=${name}&user=${user}&topic=${topic}&spotify=${spotify}&bandcamp=${bandcamp}&yt=${yt}&web=${web}`;

      document.getElementById('resultBox').style.display = 'block';

      // Update live preview directly
      document.getElementById('displayName').innerText = document.getElementById('inputName').value || 'Artist Name';
      if (topic) setupBtn('linkTopic', document.getElementById('inputTopic').value);
      if (user) setupBtn('linkProfile', 'https://chatsong.nl/u/' + document.getElementById('inputUsername').value);
      if (spotify) setupBtn('linkSpotify', document.getElementById('inputSpotify').value);
      if (bandcamp) setupBtn('linkBandcamp', document.getElementById('inputBandcamp').value);
      if (yt) setupBtn('linkYoutube', document.getElementById('inputYoutube').value);
      if (web) setupBtn('linkWeb', document.getElementById('inputWeb').value);
    }

    function copyInstagramLink() {
      navigator.clipboard.writeText(generatedUrl);
      alert('Link copied to clipboard! You can now paste this URL into your Instagram bio.');
    }

    function toggleEditor() {
      var panel = document.getElementById('editorPanel');
      panel.style.display = (panel.style.display === 'none') ? 'block' : 'none';
    }
  </script>
</body>
</html>
