<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist Hub | Powered by Chatsong</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --btn-bg: rgba(255, 255, 255, 0.08);
      --btn-hover: rgba(255, 255, 255, 0.15);
      --accent: #38bdf8;
      --accent-gradient: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      padding: 30px 20px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .profile-pic {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(56, 189, 248, 0.5);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
      margin-bottom: 12px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 5px;
    }

    .bio {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--btn-bg);
      color: var(--text-main);
      padding: 14px 18px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: var(--btn-hover);
      transform: translateY(-2px);
    }

    .btn-primary {
      background: var(--accent-gradient);
      border: none;
      box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
    }

    /* Invulscherm / Editor paneel voor artiesten */
    .editor-box {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 24px;
      text-align: left;
    }

    .editor-box h3 {
      font-size: 14px;
      margin: 0 0 10px;
      color: var(--accent);
    }

    .editor-box label {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .editor-box input {
      width: 100%;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      color: #fff;
      font-size: 12px;
      margin-bottom: 10px;
      box-sizing: border-box;
    }

    .editor-box input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .toggle-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      margin-bottom: 15px;
      text-decoration: underline;
    }

    .footer-brand {
      margin-top: 25px;
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .footer-brand a {
      color: var(--accent);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- Knop om het invulscherm in/uit te klappen -->
    <button class="toggle-btn" onclick="toggleEditor()">⚙️ Bewerk / Plak hier je links</button>

    <!-- INVULSCHEM (Hier kunnen ze hun links plakken) -->
    <div id="editorPanel" class="editor-box">
      <h3>🔗 Link Editor</h3>
      <label>Artiest Naam:</label>
      <input type="text" id="inputName" value="Artist Name" oninput="updatePage()">

      <label>Chatsong Topic Link (Release):</label>
      <input type="text" id="inputTopic" value="https://chatsong.nl/d/1832-second-single-mystery-land-out-today" oninput="updatePage()">

      <label>Chatsong Profiel Link:</label>
      <input type="text" id="inputProfile" value="https://chatsong.nl/u/artistname" oninput="updatePage()">

      <label>Bandcamp / Muziek Link:</label>
      <input type="text" id="inputMusic" value="https://artist.bandcamp.com" oninput="updatePage()">

      <label>Officiële Website:</label>
      <input type="text" id="inputWeb" value="https://artistwebsite.com" oninput="updatePage()">
    </div>

    <!-- PREVIEW VAN DE PAGINA -->
    <img src="artist-photo.jpg" alt="Artist" class="profile-pic" id="profileImg">
    <h1 id="displayName">Artist Name</h1>
    <p class="bio">Independent Musician &bull; Member of Chatsong</p>

    <div class="links">
      <a href="#" id="linkTopic" class="btn btn-primary" target="_blank">
        💬 Chatsong Topic: Latest Release
      </a>

      <a href="#" id="linkProfile" class="btn" target="_blank">
        👤 Chatsong Community Profile
      </a>

      <a href="#" id="linkMusic" class="btn" target="_blank">
        🎵 Listen on Bandcamp
      </a>

      <a href="#" id="linkWeb" class="btn" target="_blank">
        🌐 Official Website & Info
      </a>
    </div>

    <div class="footer-brand">
      Powered by <a href="https://chatsong.nl" target="_blank">Chatsong</a>
    </div>
  </div>

  <script>
    function updatePage() {
      // Haal waardes op uit de velden en zet ze direct in de knoppen
      document.getElementById('displayName').innerText = document.getElementById('inputName').value;
      document.getElementById('linkTopic').href = document.getElementById('inputTopic').value;
      document.getElementById('linkProfile').href = document.getElementById('inputProfile').value;
      document.getElementById('linkMusic').href = document.getElementById('inputMusic').value;
      document.getElementById('linkWeb').href = document.getElementById('inputWeb').value;
    }

    function toggleEditor() {
      var panel = document.getElementById('editorPanel');
      if (panel.style.display === 'none') {
        panel.style.display = 'block';
      } else {
        panel.style.display = 'none';
      }
    }

    // Voer direct uit bij laden
    updatePage();
  </script>
</body>
</html>
